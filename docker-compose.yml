
services:
  student-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-management:1.0.0
    container_name: student-management-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # Persist H2 database on the host machine
      - student-data:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  student-data:
    driver: local
