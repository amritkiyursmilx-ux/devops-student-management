# ============================================================
# Student Management System - Application Configuration
# ============================================================
spring.application.name=student-management
server.port=8080

# ------------------------------------------------------------
# H2 Database Configuration (file-based for persistence)
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/studentdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# DDL: update = create tables if not exist, preserve data on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at /h2-console during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------
# Spring Boot Actuator (used by Jenkins health check stage)
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application info shown in /actuator/info
info.app.name=Student Management System
info.app.version=1.0.0
info.app.description=DevOps Pipeline Demo with Jenkins and Docker
