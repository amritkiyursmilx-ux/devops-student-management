# ============================================================
# Test Profile - In-memory H2 for automated tests
# ============================================================
# IMPORTANT: a file named application.properties on the test classpath
# completely REPLACES the one in src/main/resources. Spring Boot does not merge
# them. Every setting that a test depends on must therefore be repeated here,
# which is why the actuator block below mirrors the production config.
#
# Using an in-memory database here also keeps the test suite away from the real
# ./data/studentdb file used by the running application.

# ------------------------------------------------------------
# H2 (in-memory) - data is discarded when the JVM exits
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:studentmgmt-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# The H2 web console is not needed during automated tests.
spring.h2.console.enabled=false

# ------------------------------------------------------------
# Actuator - needed by StudentIntegrationTest.HealthTest
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Student Management System
info.app.version=1.0.0
info.app.description=DevOps Pipeline Demo with Jenkins and Docker
